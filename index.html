<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हाजिरी प्रणाली</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 15px; background: #f1f5f9; text-align: center; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 420px; margin: 20px auto; }
    h2 { color: #0f172a; margin-bottom: 20px; font-size: 22px; }
    label { display: block; text-align: left; font-size: 13px; font-weight: bold; color: #475569; margin-top: 10px; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; outline: none; }
    button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-attend { background: #10b981; font-size: 18px; padding: 16px; margin-top: 15px; }
    .btn-reset-trigger { background: #ef4444; font-size: 13px; padding: 10px; margin-top: 20px; }
    .btn-reset-cancel { background: #64748b; margin-top: 5px; }
    .status { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; text-align: left; word-break: break-word; }
    .success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .hidden { display: none; }
    .badge { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #334155; }
    .user-info { text-align: left; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
    .reset-box { background: #fff5f5; border: 1px solid #fca5a5; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: left; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔒 हाजिरी प्रणाली</h2>

  <!-- Step 1: First Time Setup -->
  <div id="loginForm">
    <h4 style="margin: 0 0 10px 0; color: #334155;">प्रथम पटक डिभाइस सेटअप</h4>
    
    <label>एडमिन संकेत नम्बर (Admin ID):</label>
    <input type="text" id="adminId" placeholder="उदा: 101">

    <label>एडमिन पासवर्ड (Admin Password):</label>
    <input type="password" id="adminPassword" placeholder="एडमिनको पासवर्ड">

    <hr style="border:0; border-top:1px dashed #cbd5e1; margin: 15px 0;">

    <label>कर्मचारी संकेत नम्बर (Employee ID):</label>
    <input type="text" id="employeeId" placeholder="उदा: 102">

    <button onclick="verifyAndSetup()">डिभाइस प्रमाणीकरण र सेटअप</button>
  </div>

  <!-- Step 2: Dashboard -->
  <div id="dashboard" class="hidden">
    <div class="user-info">
      <p><b>कर्मचारी:</b> <span id="empName"></span></p>
      <p><b>संकेत नम्बर:</b> <span id="empId" class="badge"></span></p>
      <p><b>पद:</b> <span id="empDesig"></span></p>
      <p><b>प्रकार:</b> <span id="empType"></span></p>
    </div>

    <button class="btn-attend" onclick="triggerAttendance()">👆 हाजिरी गर्नुहोस् (Face ID / Fingerprint)</button>

    <button class="btn-reset-trigger" onclick="openResetModal()">🔄 डिभाइस रिसेट / अर्को कर्मचारी सेटअप</button>

    <!-- Admin Verification Box for Reset -->
    <div id="resetSection" class="reset-box hidden">
      <h4 style="margin:0 0 8px 0; color:#991b1b;">🔒 एडमिन प्रमाणीकरण आवश्यक</h4>
      
      <label>एडमिन ID:</label>
      <input type="text" id="resetAdminId" placeholder="उदा: 101">

      <label>एडमिन पासवर्ड:</label>
      <input type="password" id="resetAdminPassword" placeholder="एडमिन पासवर्ड">

      <button onclick="executeReset()" style="background:#dc2626;">पुष्टि गरी रिसेट गर्नुहोस्</button>
      <button onclick="closeResetModal()" class="btn-reset-cancel">रद्द गर्नुहोस्</button>
    </div>
  </div>

  <div id="statusBox" class="status hidden"></div>
</div>

<script>
  // ⚠️ आफ्नो Apps Script को Web App URL यहाँ सुनिश्चित गर्नुहोस्
  const GAS_API_URL = "https://script.google.com/macros/s/YOUR_EXEC_URL_HERE/exec";

  window.onload = function() {
    const savedUser = localStorage.getItem("emp_user");
    const savedToken = localStorage.getItem("device_token");
    if (savedUser && savedToken) {
      showDashboard(JSON.parse(savedUser));
    }
  };

  async function postToGAS(payload) {
    const res = await fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  // १. डिभाइस सेटअप र iOS/Android बायोमेट्रिक कुञ्जी सिर्जना
  async function verifyAndSetup() {
    const adminId = document.getElementById("adminId").value.trim();
    const adminPassword = document.getElementById("adminPassword").value.trim();
    const employeeId = document.getElementById("employeeId").value.trim();

    if (!adminId || !adminPassword || !employeeId) {
      showStatus("सबै विवरण प्रविष्ट गर्नुहोस्!", "error");
      return;
    }

    showStatus("प्रमाणीकरण हुँदैछ...", "info");

    try {
      const res = await postToGAS({ action: "verify_user", adminId, adminPassword, employeeId });
      if (res.status === "success") {
        
        // iPhone/Android को लागि Local Face ID / Fingerprint Key रजिस्टर गर्ने
        showStatus("कृपया डिभाइसको Face ID / Touch ID दर्ता गर्नुहोस्...", "info");
        const credId = await createLocalBiometricKey(res.employee);

        localStorage.setItem("emp_user", JSON.stringify(res.employee));
        localStorage.setItem("device_token", res.deviceToken);
        if (credId) {
          localStorage.setItem("cred_id", credId);
        }

        showDashboard(res.employee);
        showStatus("डिभाइस सेटअप सफल भयो!", "success");
      } else {
        showStatus(res.message, "error");
      }
    } catch (e) {
      showStatus("कनेक्सन त्रुटि: " + e.message, "error");
    }
  }

  // iPhone मा स्थानीय Face ID/Touch ID दर्ता गर्ने फसन
  async function createLocalBiometricKey(emp) {
    if (!window.PublicKeyCredential) return null;
    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: "Attendance System", id: window.location.hostname },
          user: {
            id: Uint8Array.from(emp.uniqueId, c => c.charCodeAt(0)),
            name: emp.uniqueId,
            displayName: emp.name
          },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: {
            authenticatorAttachment: "platform", // यसले अनिवार्य फोनको आफ्नै Face ID / Touch ID मात्र माग्छ (QR Code आउँदैन)
            userVerification: "required"
          },
          timeout: 60000
        }
      });

      const credId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      return credId;
    } catch (e) {
      console.log("Biometric creation skipped or failed: ", e);
      return null;
    }
  }

  function showDashboard(emp) {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    document.getElementById("empName").innerText = emp.name;
    document.getElementById("empId").innerText = emp.uniqueId;
    document.getElementById("empDesig").innerText = emp.designation;
    document.getElementById("empType").innerText = emp.empType;
  }

  // २. हाजिरी गर्दा Face ID / Touch ID प्रमाणीकरण
  async function triggerAttendance() {
    const emp = JSON.parse(localStorage.getItem("emp_user"));
    const deviceToken = localStorage.getItem("device_token");

    if (!emp || !deviceToken) {
      showStatus("डिभाइस सेटअप गरिएको छैन!", "error");
      return;
    }

    showStatus("कृपया Face ID / Fingerprint स्क्यान गर्नुहोस्...", "info");

    try {
      await performNativeBiometricScan();
    } catch (err) {
      showStatus("अस्वीकृत: बायोमेट्रिक प्रमाणीकरण असफल वा रद्द भयो!", "error");
      return;
    }

    showStatus("स्थान (GPS Location) पत्ता लगाइँदैछ...", "info");

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const timestamp = new Date().getTime();

        const rawMessage = emp.uniqueId + ":" + timestamp + ":" + lat + ":" + lng;
        const signature = CryptoJS.HmacSHA256(rawMessage, deviceToken).toString(CryptoJS.enc.Hex);

        showStatus("हाजिरी पठाउँदैछ...", "info");

        try {
          const res = await postToGAS({
            action: "attendance",
            uniqueId: emp.uniqueId,
            timestamp: timestamp,
            lat: lat,
            lng: lng,
            signature: signature
          });

          if (res.status === "success") {
            showStatus(res.message, "success");
          } else {
            showStatus(res.message, "error");
          }
        } catch (e) {
          showStatus("हाजिरी पठाउन सकिएन: " + e.message, "error");
        }
      },
      (err) => {
        showStatus("GPS Location अन गर्नुहोस् र पुनः प्रयास गर्नुहोस्।", "error");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // iPhone Safari को लागि सच्याइएको WebAuthn Scan फसन
  // async function performNativeBiometricScan() {
  //   if (!window.PublicKeyCredential) {
  //     throw new Error("बायोमेट्रिक सपोर्ट भएन");
  //   }

  //   const challenge = new Uint8Array(32);
  //   window.crypto.getRandomValues(challenge);

  //   const savedCredId = localStorage.getItem("cred_id");
  //   const options = {
  //     challenge: challenge,
  //     timeout: 60000,
  //     userVerification: "required"
  //   };

  //   if (savedCredId) {
  //     const rawId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));
  //     options.allowCredentials = [{
  //       id: rawId,
  //       type: 'public-key'
  //     }];
  //   }

  //   // authenticators platform मा सीमित गर्दा iPhone ले QR Code देखाउँदैन, सोझै Face ID / Touch ID खोल्छ
  //   await navigator.credentials.get({ publicKey: options });
  // }

  // कडा (Strict) बायोमेट्रिक प्रमाणीकरण फसन
async function performNativeBiometricScan() {
  if (!window.PublicKeyCredential) {
    throw new Error("यो डिभाइस/ब्राउजरमा बायोमेट्रिक सेक्युरिटी सपोर्ट गर्दैन।");
  }

  // १. डिभाइसमा फिंगरप्रिन्ट / Face ID छ कि छैन अनिवार्य जाँच गर्ने
  const isPlatformAvailable = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  
  if (!isPlatformAvailable) {
    // बायोमेट्रिक नभएको डिभाइसमा सोझै ब्लक गर्ने (अघि बढ्न नदिने)
    throw new Error("अस्वीकृत: यो डिभाइसमा फिंगरप्रिन्ट / Face ID / Screen Lock सेट गरिएको छैन। बायोमेट्रिक बिना हाजिरी गर्न पाइँदैन!");
  }

  const challenge = new Uint8Array(32);
  window.crypto.getRandomValues(challenge);

  const savedCredId = localStorage.getItem("cred_id");
  const options = {
    challenge: challenge,
    timeout: 60000,
    userVerification: "required"
  };

  if (savedCredId) {
    const rawId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));
    options.allowCredentials = [{
      id: rawId,
      type: 'public-key'
    }];
  }

  // २. फिंगरप्रिन्ट / Face ID स्क्यान माग्ने
  await navigator.credentials.get({ publicKey: options });
}

  // ३. डिभाइस रिसेट फसनहरू
  function openResetModal() {
    document.getElementById("resetSection").classList.remove("hidden");
  }

  function closeResetModal() {
    document.getElementById("resetSection").classList.add("hidden");
    document.getElementById("resetAdminId").value = "";
    document.getElementById("resetAdminPassword").value = "";
  }

  async function executeReset() {
    const adminId = document.getElementById("resetAdminId").value.trim();
    const adminPassword = document.getElementById("resetAdminPassword").value.trim();

    if (!adminId || !adminPassword) {
      showStatus("एडमिन ID र पासवर्ड प्रविष्ट गर्नुहोस्!", "error");
      return;
    }

    showStatus("जाँच हुँदैछ...", "info");

    try {
      const res = await postToGAS({ action: "verify_admin", adminId, adminPassword });
      if (res.status === "success") {
        localStorage.removeItem("emp_user");
        localStorage.removeItem("device_token");
        localStorage.removeItem("cred_id");

        closeResetModal();
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");

        showStatus("डिभाइस रिसेट भयो। अब पुनः १st सेटअप गर्नुहोस्।", "success");
      } else {
        showStatus(res.message, "error");
      }
    } catch (e) {
      showStatus("कनेक्सन त्रुटि: " + e.message, "error");
    }
  }

  function showStatus(msg, type) {
    const box = document.getElementById("statusBox");
    box.innerText = msg;
    box.className = "status " + type;
    box.classList.remove("hidden");
  }
</script>
</body>
</html>
