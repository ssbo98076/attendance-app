<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eAttendance - Biometric Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #1a5f7a;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #0288d1;
            box-shadow: 0 0 5px rgba(2, 136, 209, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-register {
            background-color: #0288d1;
            color: white;
        }
        .btn-register:hover {
            background-color: #01579b;
        }
        .btn-attendance {
            background-color: #2e7d32;
            color: white;
        }
        .btn-attendance:hover {
            background-color: #1b5e20;
        }
        .btn:disabled {
            background-color: #b0bec5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            word-break: break-word;
        }
        .status-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .status-error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .status-info {
            background-color: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>e-Attendance System</h2>
    
    <div class="input-group">
        <label for="staffId">Staff ID:</label>
        <input type="text" id="staffId" placeholder="उदा. 101" required>
    </div>

    <div class="input-group">
        <label for="staffName">Full Name (दर्ताका लागि मात्र):</label>
        <input type="text" id="staffName" placeholder="उदा. Dilip Das">
    </div>

    <button id="regBtn" class="btn btn-register" onclick="handleRegister()">बायोमेट्रिक दर्ता (Register)</button>
    <button id="attBtn" class="btn btn-attendance" onclick="handleAttendance()">हाजिरी गर्नुहोस् (Attendance)</button>

    <div id="status"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwm08541CQ2dZqgvsuMT7jiHUhVkPBAYVFAP0yIgJXF6GDF0PbazTJOoL7noPRBFW4C/exec";

    // Helper: Buffer to Base64 (URL Safe)
    function bufferToBase64(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
    }

    // Helper: Show Message
    function showStatus(message, type) {
        const statusDiv = document.getElementById("status");
        statusDiv.style.display = "block";
        statusDiv.className = "";
        statusDiv.classList.add("status-" + type);
        statusDiv.innerText = message;
    }

    // Buttons Disable/Enable
    function setLoading(loading) {
        document.getElementById("regBtn").disabled = loading;
        document.getElementById("attBtn").disabled = loading;
    }

    // GPS Location लिने Function
    function getCurrentLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve("");
            } else {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(pos.coords.latitude + "," + pos.coords.longitude),
                    () => resolve(""),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        });
    }

    // ==========================================
    // १. नयाँ बायोमेट्रिक दर्ता (REGISTER)
    // ==========================================
    async function handleRegister() {
        const staffId = document.getElementById("staffId").value.trim();
        const staffName = document.getElementById("staffName").value.trim();

        if (!staffId || !staffName) {
            showStatus("कृपया Staff ID र Full Name दुवै भर्नुहोस्!", "error");
            return;
        }

        if (!window.PublicKeyCredential) {
            showStatus("तपाईँको ब्राउजर/मोबाइलले WebAuthn Biometrics सपोर्ट गर्दैन!", "error");
            return;
        }

        try {
            setLoading(true);
            showStatus("सुरक्षा साँचो (Challenge) प्राप्त गरिँदैछ...", "info");

            // A. Backend बाट Fresh Challenge लिने
            const chalRes = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "get_challenge", staffId: staffId })
            }).then(r => r.json());

            if (chalRes.status !== "success") {
                showStatus(chalRes.message, "error");
                setLoading(false);
                return;
            }

            showStatus("कृपया मोबाइलको Fingerprint / Face ID टच गर्नुहोस्...", "info");

            const challengeBuffer = Uint8Array.from(atob(chalRes.challenge.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

            // B. Mobile Biometrics Hardware (Secure Enclave) सँग Key सिर्जना गर्ने
            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge: challengeBuffer,
                    rp: { name: "eAttendance System" },
                    user: {
                        id: Uint8Array.from(staffId, c => c.charCodeAt(0)),
                        name: staffName,
                        displayName: staffName
                    },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                    timeout: 60000
                }
            });

            const rawId = bufferToBase64(credential.rawId);
            const pubKey = bufferToBase64(credential.response.getPublicKey ? credential.response.getPublicKey() : new ArrayBuffer(0));

            showStatus("Backend मा डेटा सेभ गरिँदैछ...", "info");

            // C. Backend मा Public Key र Credential ID पठाउने
            const regRes = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "register",
                    staffId: staffId,
                    name: staffName,
                    credentialId: rawId,
                    publicKey: pubKey,
                    clientDataChallenge: chalRes.challenge
                })
            }).then(r => r.json());

            if (regRes.status === "success") {
                showStatus(regRes.message, "success");
            } else {
                showStatus(regRes.message, "error");
            }

        } catch (err) {
            showStatus("दर्ता रद्द गरियो वा त्रुटि भयो: " + err.message, "error");
        } finally {
            setLoading(false);
        }
    }

    // ==========================================
    // २. हाजिरी गर्ने (ATTENDANCE)
    // ==========================================
    async function handleAttendance() {
        const staffId = document.getElementById("staffId").value.trim();

        if (!staffId) {
            showStatus("कृपया Staff ID हाल्नुहोस्!", "error");
            return;
        }

        if (!window.PublicKeyCredential) {
            showStatus("तपाईँको ब्राउजर/मोबाइलले WebAuthn Biometrics सपोर्ट गर्दैन!", "error");
            return;
        }

        try {
            setLoading(true);
            showStatus("स्थान (GPS Location) र Challenge लिइँदैछ...", "info");

            const [locationStr, chalRes] = await Promise.all([
                getCurrentLocation(),
                fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "get_challenge", staffId: staffId })
                }).then(r => r.json())
            ]);

            if (chalRes.status !== "success") {
                showStatus(chalRes.message, "error");
                setLoading(false);
                return;
            }

            showStatus("कृपया हाजिरीका लागि बायोमेट्रिक (Fingerprint/Face ID) दिनुहोस्...", "info");

            const challengeBuffer = Uint8Array.from(atob(chalRes.challenge.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

            // B. Hardware Assertion Sign माग्ने
            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: challengeBuffer,
                    userVerification: "required",
                    timeout: 60000
                }
            });

            const clientDataJSONStr = new TextDecoder().decode(assertion.response.clientDataJSON);
            const clientDataObj = JSON.parse(clientDataJSONStr);

            showStatus("प्रमाणीकरण हुँदैछ, कृपया पर्खनुहोस्...", "info");

            // C. Signed Cryptographic Assertion Backend मा पठाउने
            const attRes = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "attendance",
                    staffId: staffId,
                    credentialId: bufferToBase64(assertion.rawId),
                    signature: bufferToBase64(assertion.response.signature),
                    authenticatorData: bufferToBase64(assertion.response.authenticatorData),
                    clientDataJSON: bufferToBase64(assertion.response.clientDataJSON),
                    clientDataChallenge: clientDataObj.challenge,
                    location: locationStr
                })
            }).then(r => r.json());

            if (attRes.status === "success") {
                showStatus(attRes.message, "success");
            } else {
                showStatus(attRes.message, "error");
            }

        } catch (err) {
            showStatus("हाजिरी अस्वीकृत वा रद्द गरियो: " + err.message, "error");
        } finally {
            setLoading(false);
        }
    }
</script>

</body>
</html>
